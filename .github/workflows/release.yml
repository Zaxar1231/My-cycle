name: Release

# Every push to main (a merged PR) builds a signed APK and publishes a GitHub Release.
# The app checks releases/latest and offers the update to users.
#
# Version bump is taken from the merged commit / PR title:
#   "feat: ..." or "#minor"                      -> minor (0.1.0 -> 0.2.0)
#   "feat!: ...", "BREAKING CHANGE" or "#major"  -> major (0.1.0 -> 1.0.0)
#   anything else                                -> patch (0.1.0 -> 0.1.1)
#   "#norelease" or "[skip release]"             -> no release
# Raising VERSION_NAME in version.properties above the latest tag uses it as is.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          if grep -qiE '#norelease|\[skip release\]' <<< "$MESSAGE"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release skipped by commit message."
            exit 0
          fi

          base=$(grep -E '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          last=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)

          if [ -z "$last" ]; then
            next="$base"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            bump="$INPUT_BUMP"
            if [ -z "$bump" ]; then
              if grep -qE 'BREAKING CHANGE|#major|^[a-z]+(\([^)]*\))?!:' <<< "$MESSAGE"; then bump=major
              elif grep -qiE '#minor|^feat(\([^)]*\))?:' <<< "$MESSAGE"; then bump=minor
              else bump=patch; fi
            fi
            case "$bump" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              *)     next="$major.$minor.$((patch + 1))" ;;
            esac
            # A manually raised base version wins.
            if [ "$(printf '%s\n%s\n' "$next" "$base" | sort -V | tail -n1)" = "$base" ] && [ "$base" != "${last#v}" ]; then
              next="$base"
            fi
          fi

          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "::error::Tag v$next already exists"
            exit 1
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "### Releasing v$next (previous: ${last:-none})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v6
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip != 'true'

      - name: Prepare signing key
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set. See README → 'Подпись релизов'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: steps.version.outputs.skip != 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease -PappVersionName=${{ steps.version.outputs.version }}

      - name: Verify signature and collect files
        if: steps.version.outputs.skip != 'true'
        run: |
          v=${{ steps.version.outputs.version }}
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/my-cycle-v$v.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/my-cycle.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publish GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.version.outputs.version }}
          gh release create "v$v" dist/* \
            --target "$GITHUB_SHA" \
            --title "Мой цикл v$v" \
            --generate-notes \
            --latest
          rm -f "$RUNNER_TEMP/release.jks"
