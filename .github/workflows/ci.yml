name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests, lint, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build (debug + unsigned release, so R8 problems show up before merge)
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: my-cycle-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Dependabot PRs and Claude PRs (claude/* branches of this repo) are merged
  # automatically once the build above is green. Add the `no-automerge` label
  # to a PR to keep it open. A merge made with GITHUB_TOKEN does not trigger
  # push workflows, so the release is started explicitly afterwards with the
  # PR title, which decides the version bump exactly like a manual merge.
  automerge:
    name: Auto-merge
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'no-automerge') &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       (startsWith(github.event.pull_request.head.ref, 'claude/') &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Merge
        run: gh pr merge "$PR_URL" --merge --match-head-commit "$HEAD_SHA"

      - name: Start release
        run: |
          # Same paths as release.yml paths-ignore: docs-only PRs do not release.
          ignored='\.md$|^docs/|^\.github/ISSUE_TEMPLATE/|^\.github/pull_request_template\.md$|^\.github/dependabot\.yml$|^LICENSE$|^\.claude/'
          if ! gh pr view "$PR_URL" --json files --jq '.files[].path' | grep -qvE "$ignored"; then
            echo "Only docs changed, no release."
            exit 0
          fi
          gh workflow run release.yml --ref main -f bump=auto -f message="$PR_TITLE"
